version: 2

models:
  - name: fct_applications
    description: >
      One row per valid application in the selected snapshot.
      Application counts differ from distinct candidate counts because
      a candidate can have multiple applications.
    columns: 
      - name: application_id
        data_tests:
          - not_null
          - unique
      - name: job_req_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_requisitions_validated')
                field: job_req_id
      - name: candidate_id
        data_tests:
          - not_null
      - name: application_date
        data_tests:
          - not_null
      - name: application_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - New Application
                  - Screening
                  - Hiring Manager Interview
                  - Interview
                  - Offer
                  - Hired
      - name: snapshot_date
        data_tests:
          - not_null
      - name: latest_valid_audit_timestamp
        data_tests:
          - not_null
  - name: rejected_applications
    columns: 
      - name: application_id
        data_tests:
          - unique
          - not_null
      - name: rejection_reason
        data_tests:
          - not_null
  - name: dim_recruiters
    columns:
      - name: recruiter_id
        data_tests:
          - unique
          - not_null
      - name: recruiter_name
        data_tests:
          - not_null
  - name: dim_requisitions
    columns:
      - name: job_req_id
        data_tests: 
          - unique
          - not_null
      - name: recruiter_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_recruiters')
                field: recruiter_id  
      - name: approved_date
        data_tests:
          - not_null
  - name: fct_application_status_events
    columns:
      - name: application_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_applications')
                field: application_id
      - name: application_status
        data_tests:
          - not_null
      - name: status_changed_at
        data_tests:
          - not_null